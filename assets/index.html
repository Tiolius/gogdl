<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; object-src 'none'; base-uri 'none'; form-action 'none'">
  <title>GOGDL</title>
  <link rel="stylesheet" href="app.css">
  <script type="module" src="app.js"></script>
</head>
<body>
  <header><strong>Каталог игр GOG</strong><div class="actions">
    <button id="theme" title="Переключить тему" aria-label="Переключить тему"><span class="material theme-symbol" aria-hidden="true"></span></button>
    <button id="settings"><span class="material settings-symbol" aria-hidden="true"></span>Настройки</button>
  </div></header>
  <main id="home">
    <section class="card">
      <div class="spread"><h2>Обновления</h2><button id="update" class="primary"><span class="material refresh-symbol" aria-hidden="true"></span>Обновить каталог</button></div>
      <p id="queueHint" class="muted">Сначала обновите каталог</p>
      <div id="queue" aria-label="Список обновлений"></div>
      <div class="spread"><p id="queueSize" class="metric">Объём выбранных: 0 Б</p><button id="downloadQueue" class="primary" disabled><span class="material download-symbol" aria-hidden="true"></span>Скачать выбранные</button></div>
    </section>
    <section class="card">
      <h2>Одна игра из каталога</h2>
      <div class="actions">
        <div class="field">
          <input id="search" type="search" placeholder="Поиск по названию или ID" autocomplete="off" aria-label="Поиск по названию или ID">
          <button id="showGames" aria-label="Показать список игр"><span class="material expand-symbol" aria-hidden="true"></span></button>
          <div id="matches" hidden></div>
        </div>
        <button id="downloadGame" class="primary" disabled><span class="material download-symbol" aria-hidden="true"></span>Скачать игру</button>
      </div>
      <div class="spread"><p id="catalogStatus" class="muted">Чтение каталога…</p><p id="gameSize" class="metric"></p></div>
    </section>
    <section class="card log-card"><h2>Журнал выполнения</h2><pre id="log" tabindex="0"></pre></section>
    <footer class="spread"><p id="status" class="muted" role="status">Готово к запуску</p>
      <div class="actions">
        <button id="openFolder"><span class="material folder-symbol" aria-hidden="true"></span>Открыть папку проекта</button>
        <button id="stop" disabled><span class="material stop-symbol" aria-hidden="true"></span>Остановить</button>
      </div>
    </footer>
  </main>
  <main id="preferences" hidden>
    <section class="card prefs-card">
      <div class="spread"><h2>Настройки</h2><button id="back"><span class="material back-symbol" aria-hidden="true"></span>Назад</button></div>
      <nav id="tabs" aria-label="Разделы настроек"></nav>
      <div id="settingsForm"></div>
      <footer><button id="save" class="primary">Сохранить</button></footer>
    </section>
  </main>
</body>
</html>
