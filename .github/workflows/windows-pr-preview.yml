name: Publish Windows PR preview

on:
  workflow_run:
    workflows: [Windows portable build]
    types: [completed]
  pull_request_target:
    branches: [main]
    types: [closed]

permissions:
  actions: read
  contents: write
  pull-requests: read

jobs:
  publish:
    if: >-
      (github.event_name == 'workflow_run' &&
       github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.event == 'pull_request' &&
       github.event.workflow_run.head_repository.full_name == github.repository) ||
      (github.event_name == 'pull_request_target' &&
       github.event.pull_request.merged &&
       github.event.pull_request.head.ref == 'work' &&
       github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    concurrency:
      group: windows-preview-${{ github.event.workflow_run.head_sha || github.event.pull_request.number }}
      cancel-in-progress: false
    steps:
      - name: Verify the source of the PR build
        if: github.event_name == 'workflow_run'
        id: preview
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
          HEAD_BRANCH: ${{ github.event.workflow_run.head_branch }}
        run: |
          set -euo pipefail
          [[ "$HEAD_SHA" =~ ^[0-9a-f]{40}$ ]]
          number=$(gh api --method GET "repos/$GH_REPO/pulls" \
            -f state=open -f base=main -f "head=${GH_REPO%/*}:$HEAD_BRANCH" |
            jq -r --arg sha "$HEAD_SHA" --arg repo "$GH_REPO" \
              '[.[] | select(.head.sha == $sha and .head.repo.full_name == $repo)][0].number // empty')
          if [[ "$number" =~ ^[0-9]+$ ]]; then
            echo "tag=pr-$number-${HEAD_SHA:0:12}" >> "$GITHUB_OUTPUT"
            echo "number=$number" >> "$GITHUB_OUTPUT"
          fi
      - name: Download the portable build
        if: steps.preview.outputs.tag != ''
        uses: actions/download-artifact@v7
        with:
          name: gogdl-windows-${{ github.event.workflow_run.run_attempt }}
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ github.token }}
      - name: Publish the ZIP without executing it
        if: steps.preview.outputs.tag != ''
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ steps.preview.outputs.tag }}
          PR_NUMBER: ${{ steps.preview.outputs.number }}
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          set -euo pipefail
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" GOGDL-Windows-x64.zip --clobber
          else
            gh release create "$TAG" GOGDL-Windows-x64.zip --target "$HEAD_SHA" \
              --title "GOGDL PR #$PR_NUMBER (${HEAD_SHA:0:12})" --prerelease --latest=false \
              --notes "Portable Windows x64 preview for #$PR_NUMBER. Extract the ZIP and run GOGDL.exe."
          fi
      - name: Delete previews for the merged work PR
        if: >-
          !cancelled() &&
          (github.event_name == 'pull_request_target' || steps.preview.outputs.number != '')
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number || steps.preview.outputs.number }}
        run: |
          set -euo pipefail
          [[ "$PR_NUMBER" =~ ^[0-9]+$ ]]
          # Also check after publishing in case the PR merged during the upload.
          merged=$(gh api "repos/$GH_REPO/pulls/$PR_NUMBER" |
            jq -r --arg repo "$GH_REPO" '
              .merged and .base.ref == "main" and
              .head.ref == "work" and .head.repo.full_name == $repo
            ')
          [[ "$merged" == true ]] || exit 0
          release_ids=$(gh api --paginate "repos/$GH_REPO/releases?per_page=100" |
            jq -r --arg pattern "^pr-$PR_NUMBER-[0-9a-f]{12}$" '
              .[] | select(.prerelease and (.tag_name | test($pattern))) | .id
            ')
          while IFS= read -r release_id; do
            [[ -n "$release_id" ]] || continue
            if ! result=$(gh api --method DELETE "repos/$GH_REPO/releases/$release_id" 2>&1); then
              # The merge and publish runs may both try to delete the same release.
              if [[ "$result" != *"(HTTP 404)"* ]]; then
                printf '%s\n' "$result" >&2
                exit 1
              fi
            fi
          done <<< "$release_ids"
